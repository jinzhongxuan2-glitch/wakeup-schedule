  .date { font-size: 11px; color: #9E9E9E; }
  .weekrow { display: flex; align-items: center; gap: 8px; }

  .today-chip { font-size: 11px; color: #004D40; background: #B2DFDB; border-radius: 8px; padding: 2px 8px; }

  .icons { margin-left: auto; display: flex; gap: 14px; color: #424242; font-size: 18px; }

  .datebar { display: flex; align-items: center; padding: 0 8px 6px; flex: none; }
  .month { width: 30px; text-align: center; font-size: 11px; color: #9E9E9E; flex: none; }
  .dcell { flex: 1; text-align: center; }
  .dcell .w { font-size: 11px; color: #9E9E9E; }
  .dcell .d { font-size: 13px; width: 24px; height: 24px; line-height: 24px; margin: 1px auto 0; border-radius: 50%; }
  .dcell.today .w { color: #26A69A; }
  .dcell.today .d { background: #26A69A; color: #fff; font-weight: 700; }

  .grid { flex: 1; position: relative; margin: 0 8px 10px; display: flex; }
  .axis { width: 30px; flex: none; display: flex; flex-direction: column; }
  .axis .sec { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .axis .n { font-size: 12px; font-weight: 500; color: #757575; }
  .axis .t { font-size: 7px; color: #BDBDBD; line-height: 1.2; }
  .days { flex: 1; position: relative; display: flex; }
  .daycol { flex: 1; position: relative; border-right: 1px solid #F5F5F5; }
  .daycol:last-child { border-right: none; }
  .lines { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; }
  .lines .l { flex: 1; border-bottom: 1px solid #F0F0F0; }

  .block {
    position: absolute; left: 2px; right: 2px; border-radius: 6px; padding: 4px;
    color: #fff; overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .block .cn { font-size: 11px; font-weight: 700; line-height: 1.25; }
  .block .loc { font-size: 9px; opacity: .92; line-height: 1.2; margin-top: 2px; }

  /* 功能面板 */
  .sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: #fff;
    border-radius: 24px 24px 0 0; padding: 18px 20px 26px; box-shadow: 0 -8px 30px rgba(0,0,0,.2);
  }
  .grabber { width: 36px; height: 4px; background: #E0E0E0; border-radius: 2px; margin: 0 auto 14px; }
  .sheet .wtitle { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .slider { height: 6px; border-radius: 3px; background: linear-gradient(to right, #26A69A 0 10%, #E0E0E0 10% 100%); position: relative; margin: 14px 0 20px; }
  .slider .thumb { position: absolute; left: 10%; top: 50%; transform: translate(-50%,-50%); width: 20px; height: 20px; background: #fff; border: 3px solid #26A69A; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 10px; margin: 10px 0 4px; }
  .tchip { width: 52px; text-align: center; }
  .tchip .sq { width: 52px; height: 52px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .tchip.sel .sq { outline: 2.5px solid #26A69A; }
  .tchip .nm { font-size: 10px; color: #757575; margin-top: 4px; white-space: nowrap; overflow: hidden; }
  .tabbtns { text-align: right; font-size: 13px; color: #26A69A; margin-bottom: 2px; }
  .tabbtns span { margin-left: 14px; }
  .fnrow { display: flex; border-top: 1px solid #F0F0F0; margin-top: 12px; padding-top: 14px; }
  .fn { flex: 1; text-align: center; font-size: 11px; color: #424242; }
  .fn .ic { font-size: 20px; color: #26A69A; margin-bottom: 5px; }
</style>

<script>
  // 左侧时间轴（12 节）
  const times = [
    ["08:00","08:45"],["08:55","09:40"],["10:05","10:50"],["11:00","11:45"],
    ["14:00","14:45"],["14:55","15:40"],["16:05","16:50"],["17:00","17:45"],
    ["19:00","19:45"],["19:55","20:40"],["20:50","21:35"],["21:45","22:30"]
  ];
  const axis = document.getElementById('axis');
  times.forEach((t, i) => {
    axis.insertAdjacentHTML('beforeend',
      `<div class="sec"><div class="n">${i+1}</div><div class="t">${t[0]}</div><div class="t">${t[1]}</div></div>`);
  });

  // 课程数据（与 App 内置示例课表第 2 周一致）
  // day: 0=周一 ... 6=周日; start: 起始节(1-based); len: 连上节数
  const courses = [
    { day:0, start:1, len:2, name:"高等数学A(下)", loc:"教一-201", c:"#64B5F6" },
    { day:0, start:3, len:2, name:"数据结构与算法", loc:"计科楼-305", c:"#F06292" },
    { day:0, start:5, len:2, name:"大学英语(四)", loc:"外语楼-412", c:"#FFB74D" },
    { day:1, start:1, len:2, name:"操作系统原理", loc:"计科楼-302", c:"#9575CD" },
    { day:1, start:5, len:2, name:"体育(羽毛球)", loc:"体育馆2F", c:"#81C784" },
    { day:1, start:7, len:2, name:"马克思主义基本原理", loc:"教二-108", c:"#FF8A65" },
    { day:2, start:3, len:2, name:"高等数学A(下)", loc:"教一-201", c:"#64B5F6" },
    { day:2, start:7, len:2, name:"程序设计实践", loc:"实验楼-B204", c:"#4DD0E1" },
    { day:2, start:9, len:2, name:"大学物理(下)", loc:"物理楼-101", c:"#7986CB" },
    { day:3, start:1, len:2, name:"数据结构与算法", loc:"计科楼-305", c:"#F06292" },
    { day:3, start:3, len:2, name:"线性代数", loc:"教一-305", c:"#4DB6AC" },
    { day:4, start:1, len:2, name:"大学英语(四)", loc:"外语楼-412", c:"#FFB74D" },
    { day:4, start:9, len:2, name:"通识选修·电影鉴赏", loc:"艺术楼-201", c:"#BA68C8" }
  ];

  const days = document.getElementById('days');
  for (let d = 0; d < 7; d++) {
    const col = document.createElement('div');
    col.className = 'daycol';
    const lines = document.createElement('div');
    lines.className = 'lines';
    for (let i = 0; i < 12; i++) lines.insertAdjacentHTML('beforeend', '<div class="l"></div>');
    col.appendChild(lines);
    days.appendChild(col);
  }
  courses.forEach(k => {
    const col = days.children[k.day];
    const top = ((k.start - 1) / 12 * 100).toFixed(3);
    const h = (k.len / 12 * 100).toFixed(3);
    col.insertAdjacentHTML('beforeend',
      `<div class="block" style="top:calc(${top}% + 1px); height:calc(${h}% - 2px); background:${k.c}">
        <div class="cn">${k.name}</div><div class="loc">@${k.loc}</div>
      </div>`);
  });
</script>
